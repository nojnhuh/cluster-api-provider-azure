- op: test
  path: /spec/template/spec/resources/0/kind
  value: VirtualMachine
- op: add
  path: /spec/template/spec/resources/0/spec/hardwareProfile
  value:
    vmSize: ${AZURE_CONTROL_PLANE_MACHINE_TYPE}
- op: test
  path: /spec/template/spec/resources/1/kind
  value: NetworkInterface
- op: add
  path: /spec/template/spec/resources/1/spec/networkSecurityGroup/reference/name
  value: ${CLUSTER_NAME}-controlplane
- op: add
  path: /spec/template/spec/resources/1/spec/ipConfigurations/0/loadBalancerBackendAddressPools
  value:
    - reference:
        armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
- op: add
  path: /spec/template/spec/resources/1/spec/ipConfigurations/0/subnet/reference/name
  value: ${CLUSTER_NAME}-controlplane
