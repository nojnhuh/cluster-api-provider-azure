apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
# Compose components into a complete cluster
- ../../components/cluster/core
- ../../components/machines/linux-md
- ../../components/identity/cluster-identity

patches:
# Apply the identity ref patch from the identity component
- path: ../../components/identity/cluster-identity/azurecluster-identity-ref.yaml

sortOptions:
  order: fifo
