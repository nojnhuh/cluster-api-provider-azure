apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
# Compose AKS cluster from components
- ../../components/cluster/aks
- ../../components/machines/aks-pool
- ../../components/identity/cluster-identity

patches:
# Apply identity ref to AzureManagedControlPlane (not AzureCluster)
- path: ../../components/identity/cluster-identity/managedcontrolplane-identity-ref.yaml

sortOptions:
  order: fifo
