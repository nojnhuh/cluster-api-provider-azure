---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  clusterNetwork:
    apiServerPort: 6443
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: AzureASOCluster
    name: ${CLUSTER_NAME}
  controlPlaneRef:
    apiGroup: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-controlplane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: AzureASOCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  controlPlaneEndpointSource:
    host:
      configMap:
        name:
          value: ${CLUSTER_NAME}-controlplane-ip
        key:
          value: host
    port:
      configMap:
        name:
          value: ${CLUSTER_NAME}-controlplane-lb
        key:
          value: port
  patches:
  - jsonPatches:
    - op: add
      path: /metadata/annotations
      value:
        serviceoperator.azure.com/credential-from: ${ASO_CREDENTIAL_SECRET_NAME}
  - selectors: # kinds owned by ResourceGroup
    - kind: VirtualNetwork
    - kind: PublicIPAddress
    - kind: LoadBalancer
    - kind: NetworkSecurityGroup
    - kind: NatGateway
    - kind: RouteTable
    jsonPatches:
    - op: add
      path: /spec/owner
      value:
        name: ${CLUSTER_NAME}
  - selectors: # kinds owned by VirtualNetwork
    - kind: VirtualNetworksSubnet
    jsonPatches:
    - op: add
      path: /spec/owner
      value:
        name: ${CLUSTER_NAME}
  - selectors: # kinds requiring location
    - kind: ResourceGroup
    - kind: VirtualNetwork
    - kind: PublicIPAddress
    - kind: LoadBalancer
    - kind: NetworkSecurityGroup
    - kind: NatGateway
    - kind: RouteTable
    jsonPatches:
    - op: add
      path: /spec/location
      value: ${AZURE_LOCATION}
  - selectors:
    - kind: LoadBalancer
      name: ${CLUSTER_NAME}
    jsonPatches:
    - op: add
      path: /spec/loadBalancingRules/0/backendPort
      valueFrom:
        template: |-
          {{ .clusterV1beta2.spec.clusterNetwork.apiServerPort }}
    - op: add
      path: /spec/loadBalancingRules/0/frontendPort
      valueFrom:
        template: |-
          {{ .clusterV1beta2.spec.clusterNetwork.apiServerPort }}
    - op: add
      path: /spec/probes/0/port
      valueFrom:
        template: |-
          {{ .clusterV1beta2.spec.clusterNetwork.apiServerPort }}
  - selectors:
    - kind: NetworkSecurityGroupsSecurityRule
      name: ${CLUSTER_NAME}-allow-apiserver
    jsonPatches:
    - op: add
      path: /spec/destinationPortRange
      valueFrom:
        template: |-
          "{{ .clusterV1beta2.spec.clusterNetwork.apiServerPort }}"
  resources:
  - apiVersion: resources.azure.com/v1api20200601
    kind: ResourceGroup
    metadata:
      name: ${CLUSTER_NAME}
    spec: {}
  - apiVersion: network.azure.com/v1api20240301
    kind: VirtualNetwork
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      addressSpace:
        addressPrefixes:
        - 10.0.0.0/16
  - apiVersion: network.azure.com/v1api20240301
    kind: VirtualNetworksSubnet
    metadata:
      name: ${CLUSTER_NAME}-controlplane
    spec:
      addressPrefix: 10.0.0.0/24
      natGateway:
        reference:
          group: network.azure.com
          kind: NatGateway
          name: ${CLUSTER_NAME}
      networkSecurityGroup:
        reference:
          group: network.azure.com
          kind: NetworkSecurityGroup
          name: ${CLUSTER_NAME}-controlplane
  - apiVersion: network.azure.com/v1api20240301
    kind: VirtualNetworksSubnet
    metadata:
      name: ${CLUSTER_NAME}-worker
    spec:
      owner:
        name: ${CLUSTER_NAME}
      addressPrefix: 10.0.1.0/24
      natGateway:
        reference:
          group: network.azure.com
          kind: NatGateway
          name: ${CLUSTER_NAME}
      networkSecurityGroup:
        reference:
          group: network.azure.com
          kind: NetworkSecurityGroup
          name: ${CLUSTER_NAME}-worker
  - apiVersion: network.azure.com/v1api20240301
    kind: PublicIPAddress
    metadata:
      name: ${CLUSTER_NAME}-controlplane
    spec:
      sku:
        name: Standard
      publicIPAllocationMethod: Static
      operatorSpec:
        configMapExpressions:
        - name: ${CLUSTER_NAME}-controlplane-ip
          key: host
          value: self.status.ipAddress
  - apiVersion: network.azure.com/v1api20240301
    kind: LoadBalancer
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      sku:
        name: Standard
      frontendIPConfigurations:
      - name: controlplane
        publicIPAddress:
          reference:
            group: network.azure.com
            kind: PublicIPAddress
            name: ${CLUSTER_NAME}-controlplane
      backendAddressPools:
      - name: controlplane
      loadBalancingRules:
      - name: controlplane
        backendAddressPools:
        - reference:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
        frontendIPConfiguration:
          reference:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/frontendIPConfigurations/controlplane
        protocol: Tcp
        disableOutboundSnat: true
        probe:
          reference:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/probes/apiserver
      probes:
      - name: apiserver
        protocol: Https
        requestPath: /readyz
      operatorSpec:
        configMapExpressions:
        - name: ${CLUSTER_NAME}-controlplane-lb
          key: port
          value: string(self.spec.loadBalancingRules[0].frontendPort)
  - apiVersion: network.azure.com/v1api20240301
    kind: LoadBalancersInboundNatRule
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      backendAddressPool:
        reference:
          armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
      backendPort: 22
      frontendIPConfiguration:
        reference:
          armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/frontendIPConfigurations/controlplane
      # We don't generally create more than 5 control plane nodes.
      frontendPortRangeStart: 2200
      frontendPortRangeEnd: 2204
      owner:
        name: ${CLUSTER_NAME}
      protocol: Tcp
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroup
    metadata:
      name: ${CLUSTER_NAME}-controlplane
    spec: {}
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroupsSecurityRule
    metadata:
      name: ${CLUSTER_NAME}-allow-apiserver
    spec:
      azureName: AllowApiServer
      owner:
        name: ${CLUSTER_NAME}-controlplane
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: "*"
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      priority: 2000
      direction: Inbound
      description: Allow access to kube-apiserver
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroupsSecurityRule
    metadata:
      name: ${CLUSTER_NAME}-allow-ssh
    spec:
      azureName: AllowSSH
      owner:
        name: ${CLUSTER_NAME}-controlplane
      access: Allow
      protocol: Tcp
      sourceAddressPrefix: "*"
      sourcePortRange: "*"
      destinationAddressPrefix: "*"
      destinationPortRange: '22'
      priority: 2200
      direction: Inbound
      description: Allow SSH access
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroup
    metadata:
      name: ${CLUSTER_NAME}-worker
    spec: {}
  - apiVersion: network.azure.com/v1api20240301
    kind: PublicIPAddress
    metadata:
      name: ${CLUSTER_NAME}-nat-gateway
    spec:
      sku:
        name: Standard
      publicIPAllocationMethod: Static
  - apiVersion: network.azure.com/v1api20240301
    kind: NatGateway
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      publicIpAddresses:
      - reference:
          group: network.azure.com
          kind: PublicIPAddress
          name: ${CLUSTER_NAME}-nat-gateway
      sku:
        name: Standard
  - apiVersion: network.azure.com/v1api20240301
    kind: RouteTable
    metadata:
      name: ${CLUSTER_NAME}
    spec: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: ${CLUSTER_NAME}-azure-json
  namespace: default
stringData:
  controlplane: |
    {
      "tenantId": "${AZURE_TENANT_ID}",
      "subscriptionId": "${AZURE_SUBSCRIPTION_ID}",
      "resourceGroup": "${CLUSTER_NAME}",
      "location": "${AZURE_LOCATION}",
      "subnetName": "${CLUSTER_NAME}-controlplane",
      "vnetName": "${CLUSTER_NAME}",
      "vnetResourceGroup": "${CLUSTER_NAME}",
      "securityGroupName": "${CLUSTER_NAME}-worker",
      "securityGroupResourceGroup": "${CLUSTER_NAME}",
      "routeTableName": "${CLUSTER_NAME}",
      "loadBalancerSku": "standard",
      "useInstanceMetadata": true,
      "useManagedIdentityExtension": true
    }
  worker: |
    {
      "tenantId": "${AZURE_TENANT_ID}",
      "subscriptionId": "${AZURE_SUBSCRIPTION_ID}",
      "resourceGroup": "${CLUSTER_NAME}",
      "location": "${AZURE_LOCATION}",
      "subnetName": "${CLUSTER_NAME}-worker",
      "vnetName": "${CLUSTER_NAME}",
      "vnetResourceGroup": "${CLUSTER_NAME}",
      "securityGroupName": "${CLUSTER_NAME}-worker",
      "securityGroupResourceGroup": "${CLUSTER_NAME}",
      "routeTableName": "${CLUSTER_NAME}",
      "loadBalancerSku": "standard",
      "useInstanceMetadata": true,
      "useManagedIdentityExtension": true
    }
---
kind: KubeadmControlPlane
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
metadata:
  name: "${CLUSTER_NAME}-controlplane"
  namespace: default
spec:
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AzureASOMachineTemplate
        name: "${CLUSTER_NAME}-controlplane"
  kubeadmConfigSpec:
    initConfiguration:
      nodeRegistration:
        name: '{{ ds.meta_data["local_hostname"] }}'
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
      timeouts:
        controlPlaneComponentHealthCheckSeconds: 1200
    joinConfiguration:
      nodeRegistration:
        name: '{{ ds.meta_data["local_hostname"] }}'
        kubeletExtraArgs:
          - name: cloud-provider
            value: external
      timeouts:
        controlPlaneComponentHealthCheckSeconds: 1200
    clusterConfiguration:
      controllerManager:
        extraArgs:
          - name: allocate-node-cidrs
            value: "false"
          - name: cluster-name
            value: ${CLUSTER_NAME}
          - name: cloud-provider
            value: external
      etcd:
        local:
          dataDir: "/var/lib/etcddisk/etcd"
          extraArgs:
            - name: quota-backend-bytes
              value: "8589934592"
    files:
      - contentFrom:
          secret:
            name: ${CLUSTER_NAME}-azure-json
            key: controlplane
        owner: root:root
        path: /etc/kubernetes/azure.json
        permissions: "0644"
    diskSetup:
      partitions:
        - device: /dev/disk/azure/scsi1/lun0
          tableType: gpt
          layout: true
          overwrite: false
      filesystems:
        - label: etcd_disk
          filesystem: ext4
          device: /dev/disk/azure/scsi1/lun0
          extraOpts:
            - "-E"
            - "lazy_itable_init=1,lazy_journal_init=1"
        - label: ephemeral0
          filesystem: ext4
          device: ephemeral0.1
          replaceFS: ntfs
    mounts:
      - - LABEL=etcd_disk
        - /var/lib/etcddisk
    verbosity: 10
  version: "${KUBERNETES_VERSION}"
---
kind: AzureASOMachineTemplate
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
metadata:
  name: "${CLUSTER_NAME}-controlplane"
  namespace: default
spec:
  template:
    spec:
      providerIDSource:
        configMap:
          name:
            template: |-
              {{ .selfV1alpha1.metadata.name }}
          key:
            value: provider-id
      patches:
      - selectors:
        - kind: VirtualMachine
        - kind: NetworkInterface
        - kind: RoleAssignment
        jsonPatches:
        - op: add
          path: /metadata
          valueFrom:
            template: |-
              name: {{ .selfV1alpha1.metadata.name }}
      - selectors:
        - kind: VirtualMachine
        jsonPatches:
        - op: add
          path: /spec/networkProfile/networkInterfaces/0/reference/name
          valueFrom:
            template: |-
              {{ .selfV1alpha1.metadata.name }}
        - op: add
          path: /spec/osProfile/computerName
          valueFrom:
            template: |-
              {{ .selfV1alpha1.metadata.name }}
        - op: add
          path: /spec/operatorSpec/configMapExpressions/0/name
          valueFrom:
            template: |-
              {{ .selfV1alpha1.metadata.name }}
        - op: add
          path: /spec/operatorSpec/configMapExpressions/1/name
          valueFrom:
            template: |-
              {{ .selfV1alpha1.metadata.name }}
        - op: add
          path: /spec/storageProfile
          valueFrom:
            template: |-
              imageReference:
                communityGalleryImageId: /CommunityGalleries/ClusterAPI-f72ceb4f-5159-4c26-a0fe-2ea738f0d019/Images/capi-ubun2-2404/Versions/{{ slice .machineV1beta2.spec.version 1 }}
        - op: add
          path: /spec/osProfile/customData
          valueFrom:
            template: |-
              {{- if .bootstrapSecret }}
                {{ index .bootstrapSecret.data "value" }}
              {{- end }}
      - selectors:
        - kind: RoleAssignment
        jsonPatches:
        - op: add
          path: /spec/principalIdFromConfig/name
          valueFrom:
            template: |-
              {{ .selfV1alpha1.metadata.name }}
      - jsonPatches:
        - op: add
          path: /metadata/annotations
          value:
            serviceoperator.azure.com/credential-from: ${ASO_CREDENTIAL_SECRET_NAME}
      resources:
      - apiVersion: compute.azure.com/v1api20220301
        kind: VirtualMachine
        spec:
          diagnosticsProfile:
            bootDiagnostics:
              enabled: true
          hardwareProfile:
            vmSize: ${AZURE_CONTROL_PLANE_MACHINE_TYPE}
          location: ${AZURE_LOCATION}
          networkProfile:
            networkInterfaces:
            - reference:
                group: network.azure.com
                kind: NetworkInterface
          osProfile:
            adminUsername: capi
            linuxConfiguration:
              disablePasswordAuthentication: true
              ssh:
                publicKeys:
                - keyData: ${AZURE_SSH_PUBLIC_KEY}
                  path: /home/capi/.ssh/authorized_keys
          identity:
            type: SystemAssigned
          owner:
            name: ${CLUSTER_NAME}
          operatorSpec:
            configMapExpressions:
            - key: identity-principal-id
              value: |
                self.status.identity.principalId
            - key: provider-id
              # This expression handles cases where the resource group name portion of the
              # VM's id contains uppercase letters, which cloud-provider-azure converts to
              # lowercase when calculating the Node's spec.providerID. When it is known that
              # the resource group name does not contain uppercase letters, this can be
              # simplified to:
              #
              #     "azure://"+self.status.id
              #
              value: |
                "azure://"
                // The portion before the resource group name
                + self.status.id.substring(
                    0,                                                                    // from the beginning of the string
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()  // to the end of the first occurrence of '/resourceGroups/'
                  )
                // The resource group name transformed to lower case
                + self.status.id.substring(
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()  // from after the first portion to the end of the string
                  ).substring(                                                            // isolate the portion until the next '/' (the end of the resource group name)
                    0,
                    self.status.id.substring(
                      self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()
                    ).indexOf('/')
                  ).lowerAscii()
                // The portion after the resource group name
                + self.status.id.substring(
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()                                           // the length of the first portion
                    + self.status.id.substring(self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()).indexOf('/')  // the length of the second portion
                    // ...to the end of the string
                  )
      - apiVersion: network.azure.com/v1api20240301
        kind: NetworkInterface
        spec:
          location: ${AZURE_LOCATION}
          owner:
            name: ${CLUSTER_NAME}
          networkSecurityGroup:
            reference:
              group: network.azure.com
              kind: NetworkSecurityGroup
              name: ${CLUSTER_NAME}-controlplane
          ipConfigurations:
          - name: ipconfig
            loadBalancerBackendAddressPools:
            - reference:
                armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
            subnet:
              reference:
                group: network.azure.com
                kind: VirtualNetworksSubnet
                name: ${CLUSTER_NAME}-controlplane
      - apiVersion: authorization.azure.com/v1api20220401
        kind: RoleAssignment
        spec:
          owner:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}
          principalIdFromConfig:
            key: identity-principal-id
          roleDefinitionReference:
            # This ARM ID represents "Contributor" - you can read about other built in roles here: https://docs.microsoft.com/en-us/azure/role-based-access-control/built-in-roles
            armId: /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineDeployment
metadata:
  name: "${CLUSTER_NAME}-md-0"
  namespace: default
spec:
  clusterName: "${CLUSTER_NAME}"
  replicas: ${WORKER_MACHINE_COUNT:=2}
  selector:
    matchLabels:
  template:
    spec:
      clusterName: "${CLUSTER_NAME}"
      version: "${KUBERNETES_VERSION}"
      bootstrap:
        configRef:
          apiGroup: bootstrap.cluster.x-k8s.io
          kind: KubeadmConfigTemplate
          name: "${CLUSTER_NAME}-md-0"
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: AzureASOMachineTemplate
        name: "${CLUSTER_NAME}-md-0"
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
kind: KubeadmConfigTemplate
metadata:
  name: "${CLUSTER_NAME}-md-0"
  namespace: default
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          name: '{{ ds.meta_data["local_hostname"] }}'
          kubeletExtraArgs:
            - name: cloud-provider
              value: external
      files:
      - contentFrom:
          secret:
            name: ${CLUSTER_NAME}-azure-json
            key: worker
        owner: root:root
        path: /etc/kubernetes/azure.json
        permissions: "0644"
---
