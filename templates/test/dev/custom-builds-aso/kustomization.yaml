apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- ../../ci/prow-aso
- ../../../asoapi-creds/credentials.yaml
- ../../../addons/cluster-api-helm/cloud-provider-azure-ci.yaml

patches:
- path: patches/privatedns.yaml
  target:
    kind: AzureASOCluster
- path: patches/storage-read.yaml
  target:
    kind: AzureASOMachineTemplate
- path: ../../../test/ci/prow-ci-version/patches/oot-credential-provider.yaml
  target:
    group: bootstrap.cluster.x-k8s.io
    kind: KubeadmConfigTemplate
    name: .*-md-0
    namespace: default
    version: v1beta1
- path: ../../../test/ci/prow-ci-version/patches/oot-credential-provider-kcp.yaml
  target:
    group: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: .*-controlplane
    version: v1beta1
- path: ../custom-builds/patches/kubeadm-bootstrap.yaml
  target:
    group: bootstrap.cluster.x-k8s.io
    kind: KubeadmConfigTemplate
    name: .*-md-0
    namespace: default
    version: v1beta1
- path: ../custom-builds/patches/kubeadm-controlplane-bootstrap.yaml
  target:
    group: controlplane.cluster.x-k8s.io
    kind: KubeadmControlPlane
    name: .*-controlplane
    version: v1beta1
- path: patches/machine-deployment-pr-version.yaml

sortOptions:
  order: fifo
