apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  labels:
    cloud-provider: ${CLOUD_PROVIDER_AZURE_LABEL:=azure}
    cni: calico
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  clusterNetwork:
    apiServerPort: 6443
    pods:
      cidrBlocks:
      - 192.168.0.0/16
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: ${CLUSTER_NAME}-controlplane
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: AzureASOCluster
    name: ${CLUSTER_NAME}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: AzureASOCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  controlPlaneEndpointSource:
    host:
      configMap:
        key:
          value: host
        name:
          value: ${CLUSTER_NAME}-controlplane-ip
    port:
      configMap:
        key:
          value: port
        name:
          value: ${CLUSTER_NAME}-controlplane-lb
  patches:
  - jsonPatches:
    - op: add
      path: /metadata/annotations
      value:
        serviceoperator.azure.com/credential-from: ${ASO_CREDENTIAL_SECRET_NAME}
  - jsonPatches:
    - op: add
      path: /spec/owner
      value:
        name: ${CLUSTER_NAME}
    selectors:
    - kind: VirtualNetwork
    - kind: PublicIPAddress
    - kind: LoadBalancer
    - kind: NetworkSecurityGroup
    - kind: NatGateway
    - kind: RouteTable
  - jsonPatches:
    - op: add
      path: /spec/owner
      value:
        name: ${CLUSTER_NAME}
    selectors:
    - kind: VirtualNetworksSubnet
  - jsonPatches:
    - op: add
      path: /spec/location
      value: ${AZURE_LOCATION}
    selectors:
    - kind: ResourceGroup
    - kind: VirtualNetwork
    - kind: PublicIPAddress
    - kind: LoadBalancer
    - kind: NetworkSecurityGroup
    - kind: NatGateway
    - kind: RouteTable
  - jsonPatches:
    - op: add
      path: /spec/loadBalancingRules/0/backendPort
      valueFrom:
        template: '{{ .cluster.spec.clusterNetwork.apiServerPort }}'
    - op: add
      path: /spec/loadBalancingRules/0/frontendPort
      valueFrom:
        template: '{{ .cluster.spec.clusterNetwork.apiServerPort }}'
    - op: add
      path: /spec/probes/0/port
      valueFrom:
        template: '{{ .cluster.spec.clusterNetwork.apiServerPort }}'
    selectors:
    - kind: LoadBalancer
      name: ${CLUSTER_NAME}
  - jsonPatches:
    - op: add
      path: /spec/destinationPortRange
      valueFrom:
        template: '"{{ .cluster.spec.clusterNetwork.apiServerPort }}"'
    selectors:
    - kind: NetworkSecurityGroupsSecurityRule
      name: ${CLUSTER_NAME}-allow-apiserver
  resources:
  - apiVersion: resources.azure.com/v1api20200601
    kind: ResourceGroup
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      tags:
        buildProvenance: ${BUILD_PROVENANCE}
        creationTimestamp: ${TIMESTAMP}
        jobName: ${JOB_NAME}
  - apiVersion: network.azure.com/v1api20240301
    kind: VirtualNetwork
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      addressSpace:
        addressPrefixes:
        - 10.0.0.0/16
  - apiVersion: network.azure.com/v1api20240301
    kind: VirtualNetworksSubnet
    metadata:
      name: ${CLUSTER_NAME}-controlplane
    spec:
      addressPrefix: 10.0.0.0/24
      natGateway:
        reference:
          group: network.azure.com
          kind: NatGateway
          name: ${CLUSTER_NAME}
      networkSecurityGroup:
        reference:
          group: network.azure.com
          kind: NetworkSecurityGroup
          name: ${CLUSTER_NAME}-controlplane
  - apiVersion: network.azure.com/v1api20240301
    kind: VirtualNetworksSubnet
    metadata:
      name: ${CLUSTER_NAME}-worker
    spec:
      addressPrefix: 10.0.1.0/24
      natGateway:
        reference:
          group: network.azure.com
          kind: NatGateway
          name: ${CLUSTER_NAME}
      networkSecurityGroup:
        reference:
          group: network.azure.com
          kind: NetworkSecurityGroup
          name: ${CLUSTER_NAME}-worker
      owner:
        name: ${CLUSTER_NAME}
  - apiVersion: network.azure.com/v1api20240301
    kind: PublicIPAddress
    metadata:
      name: ${CLUSTER_NAME}-controlplane
    spec:
      operatorSpec:
        configMapExpressions:
        - key: host
          name: ${CLUSTER_NAME}-controlplane-ip
          value: self.status.ipAddress
      publicIPAllocationMethod: Static
      sku:
        name: Standard
  - apiVersion: network.azure.com/v1api20240301
    kind: LoadBalancer
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      backendAddressPools:
      - name: controlplane
      frontendIPConfigurations:
      - name: controlplane
        publicIPAddress:
          reference:
            group: network.azure.com
            kind: PublicIPAddress
            name: ${CLUSTER_NAME}-controlplane
      loadBalancingRules:
      - backendAddressPools:
        - reference:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
        disableOutboundSnat: true
        frontendIPConfiguration:
          reference:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/frontendIPConfigurations/controlplane
        name: controlplane
        probe:
          reference:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/probes/apiserver
        protocol: Tcp
      operatorSpec:
        configMapExpressions:
        - key: port
          name: ${CLUSTER_NAME}-controlplane-lb
          value: string(self.spec.loadBalancingRules[0].frontendPort)
      probes:
      - name: apiserver
        protocol: Https
        requestPath: /readyz
      sku:
        name: Standard
  - apiVersion: network.azure.com/v1api20240301
    kind: LoadBalancersInboundNatRule
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      backendAddressPool:
        reference:
          armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
      backendPort: 22
      frontendIPConfiguration:
        reference:
          armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/frontendIPConfigurations/controlplane
      frontendPortRangeEnd: 22
      frontendPortRangeStart: 22
      owner:
        name: ${CLUSTER_NAME}
      protocol: Tcp
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroup
    metadata:
      name: ${CLUSTER_NAME}-controlplane
    spec: {}
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroupsSecurityRule
    metadata:
      name: ${CLUSTER_NAME}-allow-apiserver
    spec:
      access: Allow
      azureName: AllowApiServer
      description: Allow access to kube-apiserver
      destinationAddressPrefix: '*'
      direction: Inbound
      owner:
        name: ${CLUSTER_NAME}-controlplane
      priority: 2000
      protocol: Tcp
      sourceAddressPrefix: '*'
      sourcePortRange: '*'
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroupsSecurityRule
    metadata:
      name: ${CLUSTER_NAME}-allow-ssh
    spec:
      access: Allow
      azureName: AllowSSH
      description: Allow SSH access
      destinationAddressPrefix: '*'
      destinationPortRange: "22"
      direction: Inbound
      owner:
        name: ${CLUSTER_NAME}-controlplane
      priority: 2200
      protocol: Tcp
      sourceAddressPrefix: '*'
      sourcePortRange: '*'
  - apiVersion: network.azure.com/v1api20240301
    kind: NetworkSecurityGroup
    metadata:
      name: ${CLUSTER_NAME}-worker
    spec: {}
  - apiVersion: network.azure.com/v1api20240301
    kind: PublicIPAddress
    metadata:
      name: ${CLUSTER_NAME}-nat-gateway
    spec:
      publicIPAllocationMethod: Static
      sku:
        name: Standard
  - apiVersion: network.azure.com/v1api20240301
    kind: NatGateway
    metadata:
      name: ${CLUSTER_NAME}
    spec:
      publicIpAddresses:
      - reference:
          group: network.azure.com
          kind: PublicIPAddress
          name: ${CLUSTER_NAME}-nat-gateway
      sku:
        name: Standard
  - apiVersion: network.azure.com/v1api20240301
    kind: RouteTable
    metadata:
      name: ${CLUSTER_NAME}
    spec: {}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: ${CLUSTER_NAME}-azure-json
  - apiVersion: network.azure.com/v1api20240601
    kind: PrivateDnsZone
    metadata:
      name: ${CLUSTER_NAME}-storage
    spec:
      azureName: privatelink.blob.core.windows.net
      location: global
      owner:
        name: ${CLUSTER_NAME}
  - apiVersion: network.azure.com/v1api20240301
    kind: PrivateEndpoint
    metadata:
      name: ${CLUSTER_NAME}-storage
    spec:
      location: ${AZURE_LOCATION}
      owner:
        name: ${CLUSTER_NAME}
      privateLinkServiceConnections:
      - groupIds:
        - blob
        name: custom-builds
        privateLinkServiceReference:
          armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG}/providers/Microsoft.Storage/storageAccounts/${AZURE_STORAGE_ACCOUNT}
      subnet:
        reference:
          group: network.azure.com
          kind: VirtualNetworksSubnet
          name: ${CLUSTER_NAME}-controlplane
  - apiVersion: network.azure.com/v1api20240601
    kind: PrivateDnsZonesVirtualNetworkLink
    metadata:
      name: ${CLUSTER_NAME}-storage
    spec:
      location: global
      owner:
        name: ${CLUSTER_NAME}-storage
      registrationEnabled: false
      virtualNetwork:
        reference:
          group: network.azure.com
          kind: VirtualNetwork
          name: ${CLUSTER_NAME}
  - apiVersion: network.azure.com/v1api20240301
    kind: PrivateEndpointsPrivateDnsZoneGroup
    metadata:
      name: ${CLUSTER_NAME}-storage
    spec:
      owner:
        name: ${CLUSTER_NAME}-storage
      privateDnsZoneConfigs:
      - name: config
        privateDnsZoneReference:
          group: network.azure.com
          kind: PrivateDnsZone
          name: ${CLUSTER_NAME}-storage
  - apiVersion: network.azure.com/v1api20240601
    kind: PrivateDnsZone
    metadata:
      name: ${CLUSTER_NAME}-acr
    spec:
      azureName: privatelink.azurecr.io
      location: global
      owner:
        name: ${CLUSTER_NAME}
  - apiVersion: network.azure.com/v1api20240301
    kind: PrivateEndpoint
    metadata:
      name: ${CLUSTER_NAME}-acr
    spec:
      location: ${AZURE_LOCATION}
      owner:
        name: ${CLUSTER_NAME}
      privateLinkServiceConnections:
      - groupIds:
        - registry
        name: custom-builds
        privateLinkServiceReference:
          armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG}/providers/Microsoft.ContainerRegistry/registries/${REGISTRY%.azurecr.io}
      subnet:
        reference:
          group: network.azure.com
          kind: VirtualNetworksSubnet
          name: ${CLUSTER_NAME}-controlplane
  - apiVersion: network.azure.com/v1api20240601
    kind: PrivateDnsZonesVirtualNetworkLink
    metadata:
      name: ${CLUSTER_NAME}-acr
    spec:
      location: global
      owner:
        name: ${CLUSTER_NAME}-acr
      registrationEnabled: false
      virtualNetwork:
        reference:
          group: network.azure.com
          kind: VirtualNetwork
          name: ${CLUSTER_NAME}
  - apiVersion: network.azure.com/v1api20240301
    kind: PrivateEndpointsPrivateDnsZoneGroup
    metadata:
      name: ${CLUSTER_NAME}-acr
    spec:
      owner:
        name: ${CLUSTER_NAME}-acr
      privateDnsZoneConfigs:
      - name: config
        privateDnsZoneReference:
          group: network.azure.com
          kind: PrivateDnsZone
          name: ${CLUSTER_NAME}-acr
---
apiVersion: v1
kind: Secret
metadata:
  name: ${CLUSTER_NAME}-azure-json
  namespace: default
stringData:
  controlplane: |
    {
      "tenantId": "${AZURE_TENANT_ID}",
      "subscriptionId": "${AZURE_SUBSCRIPTION_ID}",
      "resourceGroup": "${CLUSTER_NAME}",
      "location": "${AZURE_LOCATION}",
      "subnetName": "${CLUSTER_NAME}-controlplane",
      "vnetName": "${CLUSTER_NAME}",
      "vnetResourceGroup": "${CLUSTER_NAME}",
      "securityGroupName": "${CLUSTER_NAME}-worker",
      "securityGroupResourceGroup": "${CLUSTER_NAME}",
      "routeTableName": "${CLUSTER_NAME}",
      "loadBalancerSku": "standard",
      "useInstanceMetadata": true,
      "useManagedIdentityExtension": true
    }
  worker: |
    {
      "tenantId": "${AZURE_TENANT_ID}",
      "subscriptionId": "${AZURE_SUBSCRIPTION_ID}",
      "resourceGroup": "${CLUSTER_NAME}",
      "location": "${AZURE_LOCATION}",
      "subnetName": "${CLUSTER_NAME}-worker",
      "vnetName": "${CLUSTER_NAME}",
      "vnetResourceGroup": "${CLUSTER_NAME}",
      "securityGroupName": "${CLUSTER_NAME}-worker",
      "securityGroupResourceGroup": "${CLUSTER_NAME}",
      "routeTableName": "${CLUSTER_NAME}",
      "loadBalancerSku": "standard",
      "useInstanceMetadata": true,
      "useManagedIdentityExtension": true
    }
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  annotations:
    controlplane.cluster.x-k8s.io/skip-kube-proxy: "true"
  name: ${CLUSTER_NAME}-controlplane
  namespace: default
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        extraArgs: {}
        timeoutForControlPlane: 20m
      controllerManager:
        extraArgs:
          allocate-node-cidrs: "false"
          cloud-provider: external
          cluster-name: ${CLUSTER_NAME}
      etcd:
        local:
          dataDir: /var/lib/etcddisk/etcd
          extraArgs:
            quota-backend-bytes: "8589934592"
      kubernetesVersion: ci/${CI_VERSION}
    diskSetup:
      filesystems:
      - device: /dev/disk/azure/scsi1/lun0
        extraOpts:
        - -E
        - lazy_itable_init=1,lazy_journal_init=1
        filesystem: ext4
        label: etcd_disk
      - device: ephemeral0.1
        filesystem: ext4
        label: ephemeral0
        replaceFS: ntfs
      partitions:
      - device: /dev/disk/azure/scsi1/lun0
        layout: true
        overwrite: false
        tableType: gpt
    files:
    - contentFrom:
        secret:
          key: controlplane
          name: ${CLUSTER_NAME}-azure-json
      owner: root:root
      path: /etc/kubernetes/azure.json
      permissions: "0644"
    - content: |
        #!/bin/bash

        set -o nounset
        set -o pipefail
        set -o errexit
        [[ $(id -u) != 0 ]] && SUDO="sudo" || SUDO=""

        # Run the az login command with managed identity
        until az login --identity > /dev/null 2>&1; do sleep 5; done
        echo "Logged in Azure with managed identity"
        echo "Use OOT credential provider"
        mkdir -p /var/lib/kubelet/credential-provider
        # The blob reader role might not have propagated yet, so retry this first download until it succeeds
        until az storage blob download --blob-url "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${IMAGE_TAG_ACR_CREDENTIAL_PROVIDER}/azure-acr-credential-provider" -f /var/lib/kubelet/credential-provider/acr-credential-provider --auth-mode login; do sleep 5; done
        chmod 755 /var/lib/kubelet/credential-provider/acr-credential-provider
        az storage blob download --blob-url "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${IMAGE_TAG_ACR_CREDENTIAL_PROVIDER}/credential-provider-config.yaml" -f /var/lib/kubelet/credential-provider-config.yaml --auth-mode login
        chmod 644 /var/lib/kubelet/credential-provider-config.yaml
      owner: root:root
      path: /tmp/oot-cred-provider.sh
      permissions: "0744"
    - content: |
        #!/bin/bash

        set -o nounset
        set -o pipefail
        set -o errexit

        systemctl stop kubelet
        declare -a BINARIES=("kubeadm" "kubectl" "kubelet")
        until az login --identity; do sleep 5; done
        for BINARY in "$${BINARIES[@]}"; do
          echo "* installing package: $${BINARY} ${KUBE_GIT_VERSION}"
          az storage blob download --blob-url "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${KUBE_GIT_VERSION}/bin/linux/amd64/$${BINARY}" -f "/usr/bin/$${BINARY}" --auth-mode login
        done
        systemctl restart kubelet

        # prepull images from gcr.io/k8s-staging-ci-images and retag it to
        # registry.k8s.io so kubeadm can fetch correct images no matter what
        declare -a IMAGES=("kube-apiserver" "kube-controller-manager" "kube-proxy" "kube-scheduler")
        [[ $(id -u) != 0 ]] && SUDO="sudo" || SUDO=""
        IMAGE_REGISTRY_PREFIX=registry.k8s.io
        for IMAGE in "$${IMAGES[@]}"; do
          $${SUDO} ctr -n k8s.io images tag $$IMAGE_REGISTRY_PREFIX/$$IMAGE-amd64:"${CI_VERSION//+/_}" $$IMAGE_REGISTRY_PREFIX/$$IMAGE:"${CI_VERSION//+/_}"
          $${SUDO} ctr -n k8s.io images tag $$IMAGE_REGISTRY_PREFIX/$$IMAGE-amd64:"${CI_VERSION//+/_}" gcr.io/k8s-staging-ci-images/$$IMAGE:"${CI_VERSION//+/_}"
        done

        echo "kubeadm version: $(kubeadm version -o=short)"
        echo "kubectl version: $(kubectl version --client=true)"
        echo "kubelet version: $(kubelet --version)"
      owner: root:root
      path: /tmp/replace-k8s-binaries.sh
      permissions: "0744"
    - content: |
        #!/bin/bash

        set -o nounset
        set -o pipefail
        set -o errexit

        curl -L --retry 10 --retry-delay 5 https://github.com/mikefarah/yq/releases/download/v4.6.1/yq_linux_amd64.tar.gz --output /tmp/yq_linux_amd64.tar.gz
        tar -xzvf /tmp/yq_linux_amd64.tar.gz -C /tmp && mv /tmp/yq_linux_amd64 /usr/bin/yq
        rm /tmp/yq_linux_amd64.tar.gz

        export KUBECONFIG=/etc/kubernetes/admin.conf
        kubectl -n kube-system set image daemonset/kube-proxy kube-proxy="${REGISTRY}/kube-proxy:${KUBE_IMAGE_TAG}"
        systemctl stop kubelet
        yq e '.spec.containers[0].image = "${REGISTRY}/kube-apiserver:${KUBE_IMAGE_TAG}"' -i /etc/kubernetes/manifests/kube-apiserver.yaml
        yq e '.spec.containers[0].image = "${REGISTRY}/kube-controller-manager:${KUBE_IMAGE_TAG}"' -i /etc/kubernetes/manifests/kube-controller-manager.yaml
        yq e '.spec.containers[0].image = "${REGISTRY}/kube-scheduler:${KUBE_IMAGE_TAG}"' -i /etc/kubernetes/manifests/kube-scheduler.yaml
        systemctl restart kubelet
      owner: root:root
      path: /tmp/replace-k8s-components.sh
      permissions: "0744"
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          image-credential-provider-bin-dir: /var/lib/kubelet/credential-provider
          image-credential-provider-config: /var/lib/kubelet/credential-provider-config.yaml
        name: '{{ ds.meta_data["local_hostname"] }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          image-credential-provider-bin-dir: /var/lib/kubelet/credential-provider
          image-credential-provider-config: /var/lib/kubelet/credential-provider-config.yaml
        name: '{{ ds.meta_data["local_hostname"] }}'
    mounts:
    - - LABEL=etcd_disk
      - /var/lib/etcddisk
    postKubeadmCommands:
    - bash -c /tmp/replace-k8s-components.sh
    preKubeadmCommands:
    - bash -c /tmp/oot-cred-provider.sh
    - bash -c /tmp/replace-k8s-binaries.sh
    verbosity: 5
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
      kind: AzureASOMachineTemplate
      name: ${CLUSTER_NAME}-controlplane
  replicas: ${CONTROL_PLANE_MACHINE_COUNT:=1}
  version: ${KUBERNETES_VERSION}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: AzureASOMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-controlplane
  namespace: default
spec:
  template:
    spec:
      patches:
      - jsonPatches:
        - op: add
          path: /metadata
          valueFrom:
            template: 'name: {{ .self.metadata.name }}'
        selectors:
        - kind: VirtualMachine
        - kind: NetworkInterface
      - jsonPatches:
        - op: add
          path: /spec/networkProfile/networkInterfaces/0/reference/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/osProfile/computerName
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/operatorSpec/configMapExpressions/0/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/operatorSpec/configMapExpressions/1/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/storageProfile
          valueFrom:
            template: |-
              imageReference:
                publisher: cncf-upstream
                offer: capi
                sku: ubuntu-2204-gen1
                version: latest
        - op: add
          path: /spec/osProfile/customData
          valueFrom:
            template: |-
              {{- if .bootstrapSecret }}
                {{ index .bootstrapSecret.data "value" }}
              {{- end }}
        selectors:
        - kind: VirtualMachine
      - jsonPatches:
        - op: add
          path: /spec/principalIdFromConfig/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        selectors:
        - kind: RoleAssignment
      - jsonPatches:
        - op: add
          path: /metadata/annotations
          value:
            serviceoperator.azure.com/credential-from: ${ASO_CREDENTIAL_SECRET_NAME}
      - jsonPatches:
        - op: replace
          path: /metadata/name
          valueFrom:
            template: '{{ .self.metadata.name }}-contributor'
        selectors:
        - kind: RoleAssignment
          name: contributor
      - jsonPatches:
        - op: replace
          path: /metadata/name
          valueFrom:
            template: '{{ .self.metadata.name }}-blob-reader'
        selectors:
        - kind: RoleAssignment
          name: blob-reader
      providerIDSource:
        configMap:
          key:
            value: provider-id
          name:
            template: '{{ .self.metadata.name }}'
      resources:
      - apiVersion: compute.azure.com/v1api20220301
        kind: VirtualMachine
        spec:
          diagnosticsProfile:
            bootDiagnostics:
              enabled: true
          hardwareProfile:
            vmSize: ${AZURE_CONTROL_PLANE_MACHINE_TYPE}
          identity:
            type: SystemAssigned
          location: ${AZURE_LOCATION}
          networkProfile:
            networkInterfaces:
            - reference:
                group: network.azure.com
                kind: NetworkInterface
          operatorSpec:
            configMapExpressions:
            - key: identity-principal-id
              value: |
                self.status.identity.principalId
            - key: provider-id
              value: |
                "azure://"
                // The portion before the resource group name
                + self.status.id.substring(
                    0,                                                                    // from the beginning of the string
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()  // to the end of the first occurrence of '/resourceGroups/'
                  )
                // The resource group name transformed to lower case
                + self.status.id.substring(
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()  // from after the first portion to the end of the string
                  ).substring(                                                            // isolate the portion until the next '/' (the end of the resource group name)
                    0,
                    self.status.id.substring(
                      self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()
                    ).indexOf('/')
                  ).lowerAscii()
                // The portion after the resource group name
                + self.status.id.substring(
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()                                           // the length of the first portion
                    + self.status.id.substring(self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()).indexOf('/')  // the length of the second portion
                    // ...to the end of the string
                  )
          osProfile:
            adminUsername: capi
            linuxConfiguration:
              disablePasswordAuthentication: true
              ssh:
                publicKeys:
                - keyData: ${AZURE_SSH_PUBLIC_KEY}
                  path: /home/capi/.ssh/authorized_keys
          owner:
            name: ${CLUSTER_NAME}
      - apiVersion: network.azure.com/v1api20240301
        kind: NetworkInterface
        spec:
          ipConfigurations:
          - loadBalancerBackendAddressPools:
            - reference:
                armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CLUSTER_NAME}/providers/Microsoft.Network/loadBalancers/${CLUSTER_NAME}/backendAddressPools/controlplane
            name: ipconfig
            subnet:
              reference:
                group: network.azure.com
                kind: VirtualNetworksSubnet
                name: ${CLUSTER_NAME}-controlplane
          location: ${AZURE_LOCATION}
          networkSecurityGroup:
            reference:
              group: network.azure.com
              kind: NetworkSecurityGroup
              name: ${CLUSTER_NAME}-controlplane
          owner:
            name: ${CLUSTER_NAME}
      - apiVersion: authorization.azure.com/v1api20220401
        kind: RoleAssignment
        metadata:
          name: contributor
        spec:
          owner:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}
          principalIdFromConfig:
            key: identity-principal-id
          roleDefinitionReference:
            armId: /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c
      - apiVersion: authorization.azure.com/v1api20220401
        kind: RoleAssignment
        metadata:
          name: blob-reader
        spec:
          owner:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG}/providers/Microsoft.Storage/storageAccounts/${AZURE_STORAGE_ACCOUNT}
          principalIdFromConfig:
            key: identity-principal-id
          roleDefinitionReference:
            armId: /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.Authorization/roleDefinitions/2a2b9908-6ea1-4ae2-8e65-a410df84e7d1
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT:=2}
  selector:
    matchLabels: null
  template:
    spec:
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: ${CLUSTER_NAME}-md-0
      clusterName: ${CLUSTER_NAME}
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
        kind: AzureASOMachineTemplate
        name: ${CLUSTER_NAME}-md-0
      version: ${KUBERNETES_VERSION}
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: default
spec:
  template:
    spec:
      files:
      - contentFrom:
          secret:
            key: worker
            name: ${CLUSTER_NAME}-azure-json
        owner: root:root
        path: /etc/kubernetes/azure.json
        permissions: "0644"
      - content: |
          #!/bin/bash

          set -o nounset
          set -o pipefail
          set -o errexit
          [[ $(id -u) != 0 ]] && SUDO="sudo" || SUDO=""

          # Run the az login command with managed identity
          until az login --identity > /dev/null 2>&1; do sleep 5; done
          echo "Logged in Azure with managed identity"
          echo "Use OOT credential provider"
          mkdir -p /var/lib/kubelet/credential-provider
          # The blob reader role might not have propagated yet, so retry this first download until it succeeds
          until az storage blob download --blob-url "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${IMAGE_TAG_ACR_CREDENTIAL_PROVIDER}/azure-acr-credential-provider" -f /var/lib/kubelet/credential-provider/acr-credential-provider --auth-mode login; do sleep 5; done
          chmod 755 /var/lib/kubelet/credential-provider/acr-credential-provider
          az storage blob download --blob-url "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${IMAGE_TAG_ACR_CREDENTIAL_PROVIDER}/credential-provider-config.yaml" -f /var/lib/kubelet/credential-provider-config.yaml --auth-mode login
          chmod 644 /var/lib/kubelet/credential-provider-config.yaml
        owner: root:root
        path: /tmp/oot-cred-provider.sh
        permissions: "0744"
      - content: |
          #!/bin/bash

          set -o nounset
          set -o pipefail
          set -o errexit

          systemctl stop kubelet
          declare -a BINARIES=("kubeadm" "kubectl" "kubelet")
          until az login --identity > /dev/null 2>&1; do sleep 5; done
          for BINARY in "$${BINARIES[@]}"; do
            echo "* installing package: $${BINARY} ${KUBE_GIT_VERSION}"
            az storage blob download --blob-url "https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net/${AZURE_BLOB_CONTAINER_NAME}/${KUBE_GIT_VERSION}/bin/linux/amd64/$${BINARY}" -f "/usr/bin/$${BINARY}" --auth-mode login
          done
          systemctl restart kubelet

          echo "kubeadm version: $(kubeadm version -o=short)"
          echo "kubectl version: $(kubectl version --client=true)"
          echo "kubelet version: $(kubelet --version)"
        owner: root:root
        path: /tmp/replace-k8s-binaries.sh
        permissions: "0744"
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
            image-credential-provider-bin-dir: /var/lib/kubelet/credential-provider
            image-credential-provider-config: /var/lib/kubelet/credential-provider-config.yaml
          name: '{{ ds.meta_data["local_hostname"] }}'
      preKubeadmCommands:
      - bash -c /tmp/oot-cred-provider.sh
      - bash -c /tmp/replace-k8s-binaries.sh
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: AzureASOMachineTemplate
metadata:
  name: ${CLUSTER_NAME}-md-0
  namespace: default
spec:
  template:
    spec:
      patches:
      - jsonPatches:
        - op: add
          path: /metadata
          valueFrom:
            template: 'name: {{ .self.metadata.name }}'
        selectors:
        - kind: VirtualMachine
        - kind: NetworkInterface
      - jsonPatches:
        - op: add
          path: /spec/networkProfile/networkInterfaces/0/reference/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/osProfile/computerName
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/operatorSpec/configMapExpressions/0/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/operatorSpec/configMapExpressions/1/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        - op: add
          path: /spec/storageProfile
          valueFrom:
            template: |-
              imageReference:
                publisher: cncf-upstream
                offer: capi
                sku: ubuntu-2204-gen1
                version: latest
        - op: add
          path: /spec/osProfile/customData
          valueFrom:
            template: |-
              {{- if .bootstrapSecret }}
                {{ index .bootstrapSecret.data "value" }}
              {{- end }}
        selectors:
        - kind: VirtualMachine
      - jsonPatches:
        - op: add
          path: /spec/principalIdFromConfig/name
          valueFrom:
            template: '{{ .self.metadata.name }}'
        selectors:
        - kind: RoleAssignment
      - jsonPatches:
        - op: add
          path: /metadata/annotations
          value:
            serviceoperator.azure.com/credential-from: ${ASO_CREDENTIAL_SECRET_NAME}
      - jsonPatches:
        - op: replace
          path: /metadata/name
          valueFrom:
            template: '{{ .self.metadata.name }}-contributor'
        selectors:
        - kind: RoleAssignment
          name: contributor
      - jsonPatches:
        - op: replace
          path: /metadata/name
          valueFrom:
            template: '{{ .self.metadata.name }}-blob-reader'
        selectors:
        - kind: RoleAssignment
          name: blob-reader
      providerIDSource:
        configMap:
          key:
            value: provider-id
          name:
            template: '{{ .self.metadata.name }}'
      resources:
      - apiVersion: compute.azure.com/v1api20220301
        kind: VirtualMachine
        spec:
          diagnosticsProfile:
            bootDiagnostics:
              enabled: true
          hardwareProfile:
            vmSize: ${AZURE_NODE_MACHINE_TYPE}
          identity:
            type: SystemAssigned
          location: ${AZURE_LOCATION}
          networkProfile:
            networkInterfaces:
            - reference:
                group: network.azure.com
                kind: NetworkInterface
          operatorSpec:
            configMapExpressions:
            - key: provider-id
              value: |
                "azure://"
                // The portion before the resource group name
                + self.status.id.substring(
                    0,                                                                    // from the beginning of the string
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()  // to the end of the first occurrence of '/resourceGroups/'
                  )
                // The resource group name transformed to lower case
                + self.status.id.substring(
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()  // from after the first portion to the end of the string
                  ).substring(                                                            // isolate the portion until the next '/' (the end of the resource group name)
                    0,
                    self.status.id.substring(
                      self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()
                    ).indexOf('/')
                  ).lowerAscii()
                // The portion after the resource group name
                + self.status.id.substring(
                    self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()                                           // the length of the first portion
                    + self.status.id.substring(self.status.id.indexOf('/resourceGroups/')+'/resourceGroups/'.size()).indexOf('/')  // the length of the second portion
                    // ...to the end of the string
                  )
            - key: identity-principal-id
              value: |
                self.status.identity.principalId
          osProfile:
            adminUsername: capi
            linuxConfiguration:
              disablePasswordAuthentication: true
              ssh:
                publicKeys:
                - keyData: ${AZURE_SSH_PUBLIC_KEY}
                  path: /home/capi/.ssh/authorized_keys
          owner:
            name: ${CLUSTER_NAME}
      - apiVersion: network.azure.com/v1api20240301
        kind: NetworkInterface
        spec:
          ipConfigurations:
          - name: ipconfig
            subnet:
              reference:
                group: network.azure.com
                kind: VirtualNetworksSubnet
                name: ${CLUSTER_NAME}-worker
          location: ${AZURE_LOCATION}
          networkSecurityGroup:
            reference:
              group: network.azure.com
              kind: NetworkSecurityGroup
              name: ${CLUSTER_NAME}-worker
          owner:
            name: ${CLUSTER_NAME}
      - apiVersion: authorization.azure.com/v1api20220401
        kind: RoleAssignment
        metadata:
          name: contributor
        spec:
          owner:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}
          principalIdFromConfig:
            key: identity-principal-id
          roleDefinitionReference:
            armId: /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.Authorization/roleDefinitions/b24988ac-6180-42a0-ab88-20f7382dd24c
      - apiVersion: authorization.azure.com/v1api20220401
        kind: RoleAssignment
        metadata:
          name: blob-reader
        spec:
          owner:
            armId: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG}/providers/Microsoft.Storage/storageAccounts/${AZURE_STORAGE_ACCOUNT}
          principalIdFromConfig:
            key: identity-principal-id
          roleDefinitionReference:
            armId: /subscriptions/00000000-0000-0000-0000-000000000000/providers/Microsoft.Authorization/roleDefinitions/2a2b9908-6ea1-4ae2-8e65-a410df84e7d1
---
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: calico
  namespace: default
spec:
  chartName: tigera-operator
  clusterSelector:
    matchLabels:
      cni: calico
  namespace: tigera-operator
  releaseName: projectcalico
  repoURL: https://docs.tigera.io/calico/charts
  valuesTemplate: |
    installation:
      cni:
        type: Calico
        ipam:
          type: Calico
      calicoNetwork:
        bgp: Disabled
        windowsDataplane: HNS
        mtu: 1350
        ipPools:{{range $i, $cidr := .Cluster.spec.clusterNetwork.pods.cidrBlocks }}
        - cidr: {{ $cidr }}
          encapsulation: VXLAN{{end}}
      typhaDeployment:
        spec:
          template:
            spec:
              # By default, typha tolerates all NoSchedule taints. This breaks
              # scale-ins when it continuously gets scheduled onto an
              # out-of-date Node that is being deleted. Tolerate only the
              # NoSchedule taints that are expected.
              tolerations:
                - effect: NoExecute
                  operator: Exists
                - effect: NoSchedule
                  key: node-role.kubernetes.io/control-plane
                  operator: Exists
                - effect: NoSchedule
                  key: node.kubernetes.io/not-ready
                  operator: Exists
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 50
                    preference:
                      matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: Exists
      registry: capzcicommunity.azurecr.io
      serviceCIDRs:
        - 10.96.0.0/12 # must match cluster service CIDR (this is the default)
    # Image and registry configuration for the tigera/operator pod
    tigeraOperator:
      image: tigera/operator
      registry: capzcicommunity.azurecr.io
    calicoctl:
      image: capzcicommunity.azurecr.io/calico/ctl
    # when kubernetesServiceEndpoint (required for windows) is added
    # DNS configuration is needed to look up the api server name properly
    # https://github.com/projectcalico/calico/issues/9536
    dnsConfig:
      nameservers:
        - 127.0.0.53
      options:
        - name: edns0
        - name: trust-ad
    kubernetesServiceEndpoint:
      host: "{{ .Cluster.spec.controlPlaneEndpoint.host }}"
      port: "{{ .Cluster.spec.controlPlaneEndpoint.port }}"
    # By default, tigera tolerates all NoSchedule taints. This breaks upgrades
    # when it continuously gets scheduled onto an out-of-date Node that is being
    # deleted. Tolerate only the NoSchedule taints that are expected.
    tolerations:
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoSchedule
        key: node.kubernetes.io/not-ready
        operator: Exists
  version: ${CALICO_VERSION}
---
apiVersion: addons.cluster.x-k8s.io/v1alpha1
