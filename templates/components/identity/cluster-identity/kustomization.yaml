apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
- azure-cluster-identity.yaml

# This component adds an AzureClusterIdentity resource and patches the
# AzureCluster to reference it. The patch must be applied by the consuming
# kustomization since it targets a resource from another component.

sortOptions:
  order: fifo
